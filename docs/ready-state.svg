<svg xmlns="http://www.w3.org/2000/svg" width="440" height="624" viewBox="0 0 440 624" role="img" aria-labelledby="title desc">
  <title id="title">HeadDown compact ready state</title>
  <desc id="desc">Preview of the compact, resizable HeadDown interface before keyboard locking.</desc>
  <rect width="440" height="624" rx="24" fill="#0b0d12"/>
  <rect x="28" y="22" width="384" height="580" rx="18" fill="#0f1117" stroke="#303747" stroke-width="2"/>
  <path d="M46 22h348a18 18 0 0 1 18 18v3H28v-3a18 18 0 0 1 18-18z" fill="#6c63ff"/>
  <text x="48" y="76" fill="#f0f2f7" font-family="Segoe UI,Arial" font-size="28" font-weight="600">HeadDown</text>
  <text x="49" y="101" fill="#96a0b4" font-family="Segoe UI,Arial" font-size="13">Rest without accidental input</text>
  <rect x="48" y="120" width="344" height="154" rx="17" fill="#191d26"/>
  <text x="220" y="148" fill="#74e297" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" font-weight="600">Keyboard ready</text>
  <rect x="64" y="162" width="312" height="50" rx="13" fill="#2d965a"/>
  <text x="220" y="193" fill="#fff" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="700">LOCK KEYBOARD</text>
  <text x="220" y="236" fill="#f0f2f7" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="600">Timer: off</text>
  <text x="220" y="258" fill="#96a0b4" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11">Mouse stays active. Closing the app also unlocks it.</text>
  <text x="50" y="304" fill="#f0f2f7" font-family="Segoe UI,Arial" font-size="15" font-weight="600">Battery: 82% - on battery</text>
  <g font-family="Segoe UI,Arial" font-size="13" fill="#f0f2f7">
    <rect x="50" y="326" width="16" height="16" rx="4" fill="#6c63ff"/><path d="M54 334l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="76" y="339">Use silent heads-down timer</text>
    <rect x="328" y="321" width="40" height="25" rx="6" fill="#191d26" stroke="#363d4c"/><text x="348" y="338" text-anchor="middle">20</text><text x="374" y="338" fill="#96a0b4">min</text>
    <rect x="50" y="358" width="16" height="16" rx="4" fill="#6c63ff"/><path d="M54 366l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="76" y="371">Focus mode - silence notifications</text>
    <rect x="50" y="390" width="16" height="16" rx="4" fill="#6c63ff"/><path d="M54 398l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="76" y="403">Keep media keys working</text>
    <rect x="50" y="422" width="16" height="16" rx="4" fill="#6c63ff"/><path d="M54 430l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="76" y="435">Use eco mode while locked</text>
    <rect x="50" y="454" width="16" height="16" rx="4" fill="#6c63ff"/><path d="M54 462l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="76" y="467">Turn display off after locking</text>
  </g>
  <text x="50" y="497" fill="#96a0b4" font-family="Segoe UI,Arial" font-size="12">Eco mode: OFF</text>
  <g font-family="Segoe UI,Arial" font-size="11" font-weight="600" fill="#f0f2f7">
    <rect x="48" y="513" width="106" height="38" rx="10" fill="#191d26"/><text x="101" y="536" text-anchor="middle">DIM 10%</text>
    <rect x="167" y="513" width="106" height="38" rx="10" fill="#191d26"/><text x="220" y="536" text-anchor="middle">SCREEN OFF</text>
    <rect x="286" y="513" width="106" height="38" rx="10" fill="#191d26"/><text x="339" y="536" text-anchor="middle">RESTORE</text>
  </g>
  <text x="220" y="580" fill="#727d92" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10">Resizable window • Scrolls on smaller displays</text>
</svg>
