<svg xmlns="http://www.w3.org/2000/svg" width="520" height="820" viewBox="0 0 520 820" role="img" aria-labelledby="title desc">
  <title id="title">HeadDown locked timer state</title>
  <desc id="desc">Preview of HeadDown with the keyboard locked and silent timer running.</desc>
  <rect width="520" height="820" rx="28" fill="#0b0d12"/>
  <rect x="32" y="28" width="456" height="748" rx="20" fill="#0f1117" stroke="#303747" stroke-width="2"/>
  <path d="M52 28h416a20 20 0 0 1 20 20v3H32v-3a20 20 0 0 1 20-20z" fill="#6c63ff"/>
  <text x="62" y="92" fill="#f0f2f7" font-family="Segoe UI,Arial" font-size="34" font-weight="600">HeadDown</text>
  <text x="63" y="119" fill="#96a0b4" font-family="Segoe UI,Arial" font-size="15">Rest without accidental input</text>
  <rect x="57" y="148" width="406" height="190" rx="20" fill="#191d26"/>
  <text x="260" y="184" fill="#ff6b6b" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" font-weight="700">KEYBOARD LOCKED</text>
  <rect x="77" y="202" width="366" height="62" rx="14" fill="#dc4646"/>
  <text x="260" y="240" fill="#ffffff" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700">UNLOCK KEYBOARD</text>
  <text x="260" y="293" fill="#ffffff" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700">Timer: 19:42</text>
  <text x="260" y="318" fill="#96a0b4" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13">Display turns off in 7 seconds - move mouse to wake</text>
  <text x="62" y="376" fill="#f0f2f7" font-family="Segoe UI,Arial" font-size="17" font-weight="600">Battery: 81% - on battery</text>

  <g font-family="Segoe UI,Arial" font-size="15" fill="#f0f2f7">
    <rect x="62" y="405" width="18" height="18" rx="4" fill="#6c63ff"/><path d="M66 414l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="92" y="420">Silent timer running</text>
    <rect x="82" y="439" width="72" height="34" rx="7" fill="#191d26" stroke="#363d4c"/><text x="118" y="461" text-anchor="middle">20</text><text x="168" y="461" fill="#96a0b4">minutes</text>
    <rect x="62" y="497" width="18" height="18" rx="4" fill="#6c63ff"/><path d="M66 506l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="92" y="512">Focus mode active</text>
    <rect x="62" y="532" width="18" height="18" rx="4" fill="#6c63ff"/><path d="M66 541l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="92" y="547">Volume and playback keys allowed</text>
    <rect x="62" y="567" width="18" height="18" rx="4" fill="#6c63ff"/><path d="M66 576l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="92" y="582">Eco mode active</text>
    <rect x="62" y="602" width="18" height="18" rx="4" fill="#6c63ff"/><path d="M66 611l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="92" y="617">Display-off countdown active</text>
  </g>

  <text x="62" y="652" fill="#74e297" font-family="Segoe UI,Arial" font-size="13">Eco mode: ON (available settings applied)</text>
  <g font-family="Segoe UI,Arial" font-size="12" font-weight="600" fill="#f0f2f7">
    <rect x="57" y="674" width="122" height="46" rx="11" fill="#191d26"/><text x="118" y="702" text-anchor="middle">DIM TO 10%</text>
    <rect x="199" y="674" width="122" height="46" rx="11" fill="#191d26"/><text x="260" y="702" text-anchor="middle">SCREEN OFF</text>
    <rect x="341" y="674" width="122" height="46" rx="11" fill="#191d26"/><text x="402" y="702" text-anchor="middle">RESTORE</text>
  </g>
  <text x="260" y="750" fill="#727d92" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">Timer completion is silent. The keyboard stays locked.</text>
</svg>

