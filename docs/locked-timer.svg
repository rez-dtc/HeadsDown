<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="title desc">
  <title id="title">HeadDown v1.2 locked dashboard</title>
  <desc id="desc">Preview of the compact resizable HeadDown dashboard with keyboard locked.</desc>
  <rect width="500" height="590" rx="26" fill="#0b0d12"/>
  <rect x="28" y="24" width="444" height="542" rx="18" fill="#0f1117" stroke="#303747" stroke-width="2"/>
  <rect x="28" y="24" width="444" height="5" rx="2" fill="#6c63ff"/>
  <text x="50" y="72" fill="#f0f2f7" font-family="Segoe UI,Arial" font-size="29" font-weight="600">HeadDown</text>
  <text x="50" y="96" fill="#96a0b4" font-family="Segoe UI,Arial" font-size="13">Rest without accidental input</text>
  <text x="447" y="67" fill="#6c63ff" text-anchor="end" font-family="Segoe UI,Arial" font-size="13" font-weight="600">v1.2</text>

  <rect x="48" y="115" width="404" height="150" rx="10" fill="#191d26" stroke="#363d4c"/>
  <text x="250" y="143" fill="#ff6b6b" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" font-weight="700">KEYBOARD LOCKED</text>
  <rect x="64" y="157" width="372" height="54" rx="8" fill="#dc4646"/>
  <text x="250" y="190" fill="#fff" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" font-weight="700">UNLOCK KEYBOARD</text>
  <text x="250" y="235" fill="#fff" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" font-weight="700">Timer: 19:42</text>
  <text x="250" y="254" fill="#96a0b4" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10">Display turns off in 7 seconds - move mouse to wake</text>

  <rect x="48" y="277" width="404" height="142" rx="10" fill="#191d26" stroke="#363d4c"/>
  <text x="62" y="300" fill="#6c63ff" font-family="Segoe UI,Arial" font-size="11" font-weight="700">SESSION OPTIONS</text>
  <g font-family="Segoe UI,Arial" font-size="13" fill="#f0f2f7">
    <rect x="62" y="315" width="16" height="16" rx="3" fill="#6c63ff"/><path d="M66 323l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="86" y="328">Silent heads-down timer</text>
    <rect x="354" y="311" width="50" height="25" rx="5" fill="#0f1117" stroke="#4a5264"/><text x="379" y="328" text-anchor="middle">20</text><text x="410" y="328" fill="#96a0b4">min</text>
    <rect x="62" y="348" width="16" height="16" rx="3" fill="#6c63ff"/><path d="M66 356l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="86" y="361">Silence notifications</text>
    <rect x="254" y="348" width="16" height="16" rx="3" fill="#6c63ff"/><path d="M258 356l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="278" y="361">Keep media keys</text>
    <rect x="62" y="381" width="16" height="16" rx="3" fill="#6c63ff"/><path d="M66 389l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="86" y="394">Use eco mode</text>
    <rect x="254" y="381" width="16" height="16" rx="3" fill="#6c63ff"/><path d="M258 389l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="278" y="394">Screen off after 10 sec</text>
  </g>

  <rect x="48" y="431" width="404" height="96" rx="10" fill="#191d26" stroke="#363d4c"/>
  <text x="62" y="455" fill="#f0f2f7" font-family="Segoe UI,Arial" font-size="14" font-weight="600">Battery: 81% - on battery</text>
  <text x="62" y="475" fill="#74e297" font-family="Segoe UI,Arial" font-size="11">Eco mode: ON</text>
  <g font-family="Segoe UI,Arial" font-size="10" font-weight="600" fill="#f0f2f7">
    <rect x="58" y="486" width="122" height="30" rx="6" fill="#242936"/><text x="119" y="505" text-anchor="middle">DIM 10%</text>
    <rect x="189" y="486" width="122" height="30" rx="6" fill="#242936"/><text x="250" y="505" text-anchor="middle">SCREEN OFF</text>
    <rect x="320" y="486" width="122" height="30" rx="6" fill="#242936"/><text x="381" y="505" text-anchor="middle">RESTORE</text>
  </g>
  <text x="250" y="550" fill="#727d92" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10">Timer ends silently • Keyboard stays locked</text>
</svg>
